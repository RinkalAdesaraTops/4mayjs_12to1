<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // var keyword - redelcare & reassign are possible
        var a=10
        document.write("A is "+a)
        var a="abc"
        document.write("<br>A is "+a)
        // let & const 
        // const - constant redelcare & reassign are not possible
        const pi=3.14
        document.write("<br>PI is "+pi)
        // pi="fjdkghjdfk"
        // document.write("<br>PI is "+pi)
        // let keyword - cant redeclare but reassign is possible
        let str="Hii"
        document.write("<br>Str is "+str)
        str=5678
        document.write("<br>Str is "+str)
    </script>
</body>
</html>
